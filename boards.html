<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productivity App — Boards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body id="page-boards">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="d-flex align-items-center">
        <a href="account.html" class="btn btn-sm btn-outline-secondary rounded-circle d-inline-flex justify-content-center align-items-center" title="Account" style="width:38px;height:38px;padding:0;background:#fff">
          <img src="assets/images/placeholder-avatar.webp" alt="avatar" class="rounded-circle" style="width:32px;height:32px;">
        </a>
      </div>

      <a class="navbar-brand fw-bold ms-3 me-3" href="index.html">Quest Log</a>

      <a href="rewards.html" class="d-flex align-items-center me-3 text-decoration-none">
        <span class="badge px-3 py-2" style="font-size: 0.9rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);" title="Your total points - Click to redeem">
          <i class="bi bi-star-fill text-warning"></i> <span id="nav-points-value" class="text-white">0</span> <span class="text-white">pts</span>
        </span>
      </a>

      <form class="d-none d-md-flex ms-3 me-3" role="search">
        <input id="nav-search" class="form-control form-control-sm" type="search" placeholder="Search tasks, boards..." aria-label="Search">
      </form>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="boards.html">Boards</a></li>
          <li class="nav-item"><a class="nav-link" href="calendar.html">Calendar</a></li>
          <li class="nav-item"><a class="nav-link" href="rewards.html">Rewards</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Boards</h1>
    </div>

    <div class="d-flex gap-2 align-items-center justify-content-between mb-3">
      <p class="text-muted small mb-0">Boards are project-specific workspaces made of lists and cards. Use a board to organize tasks for a project — click a board to open it, or create a new one to get started.</p>
      <button class="btn btn-sm btn-primary text-nowrap" data-bs-toggle="modal" data-bs-target="#newBoardModal">+ Add Board</button>
    </div>

    <div class="card">
      <div class="card-body">
        <div id="boards-gallery" class="boards-gallery">
          <!-- board cards generated by JS -->
        </div>
      </div>
    </div>

    <!-- New Board Modal -->
    <div class="modal fade" id="newBoardModal" tabindex="-1" aria-labelledby="newBoardModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newBoardModalLabel">Create new board</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="new-board-form">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Board name</label>
                <input id="board-name" class="form-control" required>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-primary" type="submit">Create board</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
