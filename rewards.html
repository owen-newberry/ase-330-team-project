<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productivity App — Rewards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body id="page-rewards">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="d-flex align-items-center">
                <a href="account.html"
                    class="btn btn-sm btn-outline-secondary rounded-circle d-inline-flex justify-content-center align-items-center"
                    title="Account" style="width:38px;height:38px;padding:0;background:#fff" data-bs-toggle="tooltip" data-bs-placement="bottom" title="View your account details">
                    <img src="https://via.placeholder.com/32" alt="avatar" class="rounded-circle"
                        style="width:32px;height:32px;">
                </a>
            </div>

            <a class="navbar-brand fw-bold ms-3 me-3" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Go to the homepage">Quest Log</a>

            <span class="nav-points-badge ms-2" id="nav-points" title="Your points">0</span>

            <div class="d-flex align-items-center me-3">
                <span class="badge bg-warning text-dark px-3 py-2" style="font-size: 0.9rem;" title="Your total points">
                    <i class="bi bi-star-fill"></i> <span id="nav-points-value">0</span> pts
                </span>
            </div>

            <form class="d-none d-md-flex ms-3 me-3" role="search">
                <input id="nav-search" class="form-control form-control-sm" type="search"
                    placeholder="Search tasks, boards..." aria-label="Search" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Search for tasks or boards">
            </form>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="boards.html">Boards</a></li>
                    <li class="nav-item"><a class="nav-link" href="calendar.html">Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="rewards.html">Rewards</a></li>
                </ul>
            </div>
        </div>
    </nav>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3">Rewards</h1>
      <div>
        <a class="btn btn-sm btn-outline-primary" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Return to the homepage">Home</a>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <h5>Your points</h5>
          <p class="mb-0 display-6" id="rewards-points" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Your current points total">—</p>
        </div>
        
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Goal</h5>
        <div class="mb-2">Set a points goal to work towards.</div>
        <div class="row g-2 mb-2" style="max-width:640px">
          <div class="col-7">
            <input id="goal-title" type="text" class="form-control form-control-sm" placeholder="Goal title (e.g. New game)" data-bs-toggle="tooltip" data-bs-placement="bottom" title="What is the reward you seek for a task">
          </div>
          <div class="col-3">
            <input id="goal-input" type="number" min="1" class="form-control form-control-sm" placeholder="Points" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Enter the points cost for this goal">
          </div>
          <div class="col-2">
            <button id="add-goal" class="btn btn-sm btn-primary w-100" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Add this goal">Add</button>
          </div>
        </div>

        <div class="mb-2 small text-muted">Your goals:</div>
        <div id="goals-list" class="mb-3" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Your list of goals will appear here">
          <!-- JS will render goals here -->
        </div>
      </div>
    </div>

    

  </main>

  <canvas id="confetti-canvas"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    // Initialize all tooltips
    document.addEventListener('DOMContentLoaded', function () {
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    });
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
