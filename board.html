<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest Log — Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body id="page-board">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="d-flex align-items-center">
                <a href="account.html" class="btn btn-sm btn-outline-secondary rounded-circle d-inline-flex justify-content-center align-items-center" title="Account" style="width:38px;height:38px;padding:0;background:#fff" data-bs-toggle="tooltip" data-bs-placement="bottom" title="View your account details">
                    <img src="https://via.placeholder.com/32" alt="avatar" class="rounded-circle" style="width:32px;height:32px;">
                </a>
            </div>

            <a class="navbar-brand fw-bold ms-3 me-3" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Go to the homepage">Quest Log</a>

            <form class="d-none d-md-flex ms-3 me-3" role="search">
                <input id="nav-search" class="form-control form-control-sm" type="search" placeholder="Search tasks, boards..." aria-label="Search" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Search for tasks or boards">
            </form>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="boards.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="View all boards">Boards</a></li>
                    <li class="nav-item"><a class="nav-link" href="rewards.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Check your rewards">Rewards</a></li>
                </ul>
        </div>
    </nav>

  <header id="board-header" class="py-3 mb-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h2 id="board-title" class="h4 mb-0">Board</h2>
      <div>
        <a href="boards.html" class="btn btn-sm btn-outline-secondary" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Return to the boards page">Back to boards</a>
      </div>
    </div>
  </header>

  <main class="container" id="board-root">
    <div class="row g-3">
      <div class="col-12">
        <div class="d-flex gap-2 align-items-center mb-2">
          <div class="small text-muted">Drag cards between lists.</div>
        </div>
      </div>

      <div class="col-12">
        <div class="d-flex gap-3 board-columns">
          <div class="board-column p-2 bg-light rounded" data-col="todo">
            <h6 class="text-uppercase">To Do</h6>
            <form class="add-card-form mb-2" data-column="todo">
              <div class="input-group mb-2">
                <input class="form-control form-control-sm new-card-title" placeholder="New card title" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Enter the title of the new card">
                <button class="btn btn-sm btn-primary" type="submit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Add a new card to the To Do list">Add</button>
              </div>
              <input class="form-control form-control-sm new-card-desc" placeholder="Optional description" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Add an optional description for the card">
              <input class="form-control form-control-sm new-card-duedate mt-2" type="datetime-local" placeholder="Due date (optional)" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Optional due date for this task">
            </form>
            <div id="col-todo" class="board-list"></div>
          </div>

          <div class="board-column p-2 bg-light rounded" data-col="inprogress">
            <h6 class="text-uppercase">In Progress</h6>
            <form class="add-card-form mb-2" data-column="inprogress">
              <div class="input-group mb-2">
                <input class="form-control form-control-sm new-card-title" placeholder="New card title" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Enter the title of the new card">
                <button class="btn btn-sm btn-primary" type="submit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Add a new card to the In Progress list">Add</button>
              </div>
              <input class="form-control form-control-sm new-card-desc" placeholder="Optional description" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Add an optional description for the card">
              <input class="form-control form-control-sm new-card-duedate mt-2" type="datetime-local" placeholder="Due date (optional)" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Optional due date for this task">
            </form>
            <div id="col-inprogress" class="board-list"></div>
          </div>

          <div class="board-column p-2 bg-light rounded" data-col="done">
            <h6 class="text-uppercase">Done</h6>
            <form class="add-card-form mb-2" data-column="done">
              <div class="input-group mb-2">
                <input class="form-control form-control-sm new-card-title" placeholder="New card title" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Enter the title of the new card">
                <button class="btn btn-sm btn-primary" type="submit" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Add a new card to the Done list">Add</button>
              </div>
              <input class="form-control form-control-sm new-card-desc" placeholder="Optional description" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Add an optional description for the card">
              <input class="form-control form-control-sm new-card-duedate mt-2" type="datetime-local" placeholder="Due date (optional)" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Optional due date for this task">
            </form>
            <div id="col-done" class="board-list">
              <!-- Example card with redeem button -->
              <div class="card mb-2">
                <div class="card-body d-flex justify-content-between align-items-center">
                  <span>Sample Task</span>
                  <button class="btn btn-sm btn-success redeem-card" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Redeem points for this task">Redeem</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Task details / edit modal -->
  <div class="modal fade" id="taskDetailsModal" tabindex="-1" aria-labelledby="taskDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskDetailsModalLabel">Task Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="task-details-view">
            <h5 id="task-detail-title" class="mb-2"></h5>
            <div id="task-detail-desc" class="mb-2 text-muted"></div>
            <div id="task-detail-due" class="mb-2 small text-muted"></div>
            <div id="task-detail-meta" class="mb-2 small text-muted"></div>
          </div>

          <form id="task-edit-form" style="display:none;">
            <div class="mb-2">
              <input id="task-edit-title" class="form-control" />
            </div>
            <div class="mb-2">
              <textarea id="task-edit-desc" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-2">
              <input id="task-edit-duedate" class="form-control" type="datetime-local" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" id="task-edit-toggle" class="btn btn-sm btn-outline-primary">Edit</button>
          <button type="button" id="task-delete-btn" class="btn btn-sm btn-outline-danger">Delete</button>
          <button type="button" id="task-save-btn" class="btn btn-sm btn-primary" style="display:none;">Save</button>
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Initialize all tooltips
    document.addEventListener('DOMContentLoaded', function () {
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });

      // Add event listener for redeem buttons
      document.querySelector('#col-done').addEventListener('click', function(event) {
        if (event.target.classList.contains('redeem-card')) {
          const card = event.target.closest('.card');
          if (card) {
            // Simulate redeeming points (e.g., update points total)
            alert('Points redeemed for this task!');
            card.remove();
          }
        }
      });
    });
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
