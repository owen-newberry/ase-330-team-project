<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest Log — Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body id="page-board">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="d-flex align-items-center">
                <a href="account.html" class="btn btn-sm btn-outline-secondary rounded-circle d-inline-flex justify-content-center align-items-center" title="Account" style="width:38px;height:38px;padding:0;background:#fff" data-bs-toggle="tooltip" data-bs-placement="bottom" title="View your account details">
                    <img src="https://via.placeholder.com/32" alt="avatar" class="rounded-circle" style="width:32px;height:32px;">
                </a>
            </div>

            <a class="navbar-brand fw-bold ms-3 me-3" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Go to the homepage">Quest Log</a>

            <span class="nav-points-badge ms-2" id="nav-points" title="Your points">0</span>

            <form class="d-none d-md-flex ms-3 me-3" role="search">
                <input id="nav-search" class="form-control form-control-sm" type="search" placeholder="Search tasks, boards..." aria-label="Search" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Search for tasks or boards">
            </form>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="boards.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="View all boards">Boards</a></li>
                    <li class="nav-item"><a class="nav-link" href="rewards.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Check your rewards">Rewards</a></li>
                </ul>
        </div>
    </nav>

  <header id="board-header" class="py-3 mb-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h2 id="board-title" class="h4 mb-0">Board</h2>
      <div>
        <a href="boards.html" class="btn btn-sm btn-outline-secondary" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Return to the boards page">Back to boards</a>
      </div>
    </div>
  </header>

  <main class="container" id="board-root">
    <div class="row g-3">
      <div class="col-12">
        <div class="d-flex gap-2 align-items-center justify-content-between mb-2">
          <div class="small text-muted">Drag cards between lists.</div>
          <button class="btn btn-sm btn-primary" id="add-task-btn" data-bs-toggle="modal" data-bs-target="#newTaskModal">+ Add Task</button>
        </div>
      </div>

      <div class="col-12">
        <div class="d-flex gap-3 board-columns">
          <div class="board-column p-2 bg-light rounded" data-col="todo">
            <h6 class="text-uppercase">To Do</h6>
            <div id="col-todo" class="board-list"></div>
          </div>

          <div class="board-column p-2 bg-light rounded" data-col="inprogress">
            <h6 class="text-uppercase">In Progress</h6>
            <div id="col-inprogress" class="board-list"></div>
          </div>

          <div class="board-column p-2 bg-light rounded" data-col="done">
            <h6 class="text-uppercase">Done</h6>
            <div id="col-done" class="board-list"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Task details / edit modal -->
  <div class="modal fade" id="taskDetailsModal" tabindex="-1" aria-labelledby="taskDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskDetailsModalLabel">Task Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="task-details-view">
            <h5 id="task-detail-title" class="mb-2"></h5>
            <div id="task-detail-desc" class="mb-2 text-muted"></div>
            <div id="task-detail-due" class="mb-2 small text-muted"></div>
            <div id="task-detail-meta" class="mb-2 small text-muted"></div>
          </div>

          <form id="task-edit-form" style="display:none;">
            <div class="mb-2">
              <label class="form-label small">Title</label>
              <input id="task-edit-title" class="form-control" />
            </div>
            <div class="mb-2">
              <label class="form-label small">Description</label>
              <textarea id="task-edit-desc" class="form-control" rows="3"></textarea>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-2">
                <label class="form-label small">Due Date</label>
                <input id="task-edit-duedate" class="form-control" type="datetime-local" />
              </div>
              <div class="col-md-3 mb-2">
                <label class="form-label small">Priority</label>
                <select id="task-edit-priority" class="form-select">
                  <option value="">None</option>
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
              <div class="col-md-3 mb-2">
                <label class="form-label small">Points</label>
                <input id="task-edit-points" class="form-control" type="number" min="1" value="10" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="task-delete-btn" class="btn btn-sm btn-outline-danger">Delete</button>
          <div>
            <button type="button" id="task-edit-toggle" class="btn btn-sm btn-outline-primary">Edit</button>
            <button type="button" id="task-save-btn" class="btn btn-sm btn-primary" style="display:none;">Save</button>
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Initialize all tooltips
    document.addEventListener('DOMContentLoaded', function () {
      var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });

      // Add event listener for redeem buttons
      document.querySelector('#col-done').addEventListener('click', function(event) {
        if (event.target.classList.contains('redeem-card')) {
          const card = event.target.closest('.card');
          if (card) {
            // Simulate redeeming points (e.g., update points total)
            alert('Points redeemed for this task!');
            card.remove();
          }
        }
      });
    });
  </script>
  
  <!-- New Task Modal -->
  <div class="modal fade" id="newTaskModal" tabindex="-1" aria-labelledby="newTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newTaskModalLabel">Add New Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="new-task-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Task Title <span class="text-danger">*</span></label>
              <input id="new-task-title" class="form-control" required placeholder="What needs to be done?">
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea id="new-task-desc" class="form-control" rows="3" placeholder="Add more details..."></textarea>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-2">
                <label class="form-label">Status <span class="text-danger">*</span></label>
                <select id="new-task-column" class="form-select" required>
                  <option value="todo" selected>📋 To Do</option>
                  <option value="inprogress">🔄 In Progress</option>
                  <option value="done">✅ Done</option>
                </select>
              </div>
              <div class="col-md-6 mb-2">
                <label class="form-label">Due Date</label>
                <input id="new-task-duedate" class="form-control" type="datetime-local">
              </div>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-2">
                <label class="form-label">Priority</label>
                <select id="new-task-priority" class="form-select">
                  <option value="">None</option>
                  <option value="high">🔴 High</option>
                  <option value="medium">🟠 Medium</option>
                  <option value="low">🟢 Low</option>
                </select>
              </div>
              <div class="col-md-6 mb-2">
                <label class="form-label">Points</label>
                <input id="new-task-points" class="form-control" type="number" min="1" value="10">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
