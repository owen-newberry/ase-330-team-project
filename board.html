<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest Log — Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body id="page-board">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="d-flex align-items-center">
                <a href="account.html" class="btn btn-sm btn-outline-secondary rounded-circle d-inline-flex justify-content-center align-items-center" title="Account" style="width:38px;height:38px;padding:0;background:#fff">
                    <img src="https://via.placeholder.com/32" alt="avatar" class="rounded-circle" style="width:32px;height:32px;">
                </a>
            </div>

            <a class="navbar-brand fw-bold ms-3 me-3" href="index.html">Quest Log</a>

            <div class="d-flex align-items-center me-3">
                <span class="badge bg-warning text-dark px-3 py-2" style="font-size: 0.9rem;" title="Your total points">
                    <i class="bi bi-star-fill"></i> <span id="nav-points-value">0</span> pts
                </span>
            </div>

            <form class="d-none d-md-flex ms-3 me-3" role="search">
                <input id="nav-search" class="form-control form-control-sm" type="search" placeholder="Search tasks, boards..." aria-label="Search">
            </form>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="boards.html">Boards</a></li>
                    <li class="nav-item"><a class="nav-link" href="calendar.html">Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="rewards.html">Rewards</a></li>
                </ul>
            </div>
    </nav>

  <header id="board-header" class="py-3 mb-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h2 id="board-title" class="h4 mb-0">Board</h2>
      <div>
        <a href="boards.html" class="btn btn-sm btn-outline-secondary">Back to boards</a>
      </div>
    </div>
  </header>

  <main class="container" id="board-root">
    <div class="row g-3">
      <div class="col-12">
        <div class="card mb-3">
          <div class="card-body">
            <h6 class="card-title mb-3">Create New Task</h6>
            <form id="add-task-form">
              <div class="row g-2">
                <div class="col-md-6">
                  <input class="form-control" id="new-task-title" placeholder="Task title" required>
                </div>
                <div class="col-md-6">
                  <input class="form-control" id="new-task-desc" placeholder="Description (optional)">
                </div>
                <div class="col-md-4">
                  <select class="form-select" id="new-task-priority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                    <option value="urgent">Urgent</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <input type="date" class="form-control" id="new-task-duedate" placeholder="Due date">
                </div>
                <div class="col-md-4">
                  <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-plus-circle"></i> Add Task
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="small text-muted mb-2">
          <i class="bi bi-info-circle"></i> New tasks appear in "To Do" - drag them to move between columns
        </div>
      </div>

      <div class="col-12">
        <div class="d-flex gap-3 board-columns">
          <div class="board-column p-2 bg-light rounded" data-col="todo">
            <h6 class="text-uppercase">To Do <span class="badge bg-secondary" id="todo-count">0</span></h6>
            <div class="mb-2 small">
              <button class="btn btn-sm btn-outline-secondary sort-btn" data-col="todo" data-sort="priority">Sort by Priority</button>
              <button class="btn btn-sm btn-outline-secondary sort-btn" data-col="todo" data-sort="date">Sort by Date</button>
            </div>
            <div id="col-todo" class="board-list"></div>
          </div>

          <div class="board-column p-2 bg-light rounded" data-col="inprogress">
            <h6 class="text-uppercase">In Progress <span class="badge bg-secondary" id="inprogress-count">0</span></h6>
            <div class="mb-2 small">
              <button class="btn btn-sm btn-outline-secondary sort-btn" data-col="inprogress" data-sort="priority">Sort by Priority</button>
              <button class="btn btn-sm btn-outline-secondary sort-btn" data-col="inprogress" data-sort="date">Sort by Date</button>
            </div>
            <div id="col-inprogress" class="board-list"></div>
          </div>

          <div class="board-column p-2 bg-light rounded" data-col="done">
            <h6 class="text-uppercase">Done <span class="badge bg-secondary" id="done-count">0</span></h6>
            <div id="col-done" class="board-list"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
